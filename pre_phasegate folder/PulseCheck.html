<script>
/* =========================================================
   CONFIG
   ========================================================= */
const QUIZ_MAX = 40;                       // points for the 12-question quiz
const LANGS = {
  java:       { label: 'Java',       icon: '☕', note: 'Statically typed · int division' },
  python:     { label: 'Python',     icon: '🐍', note: 'Indentation-based · // for floor division' },
  javascript: { label: 'JavaScript', icon: '⚡', note: 'Dynamic · Math.floor for integer division' }
};
const SECTIONS = ['Variables & Operators', 'Control Structures', 'Functions & Scope', 'Arrays & Matrices'];
const REMEDY = {
  'Variables & Operators': 'Hand-trace assignments and operator precedence; drill integer division (/, //, Math.floor) and the % operator on small numbers.',
  'Control Structures':    'Build trace tables (i, total, output) for if/else chains and for-loops; practise break vs continue on 5-line programs.',
  'Functions & Scope':     'Practise parameters vs arguments, return values, and local vs global variables; predict output before running.',
  'Arrays & Matrices':     'Draw arrays and grids with index labels; practise last-index (length - 1) and row/column traversal, including diagonals.',
  'Task A':                'Re-write FizzBuzz from scratch without notes: loop over the whole range, check the "both" case first, then each single divisor.',
  'Task B':                'Practise the filter → transform → collect pattern with small arrays, including empty and all-odd inputs.',
  'Task C':                'Work through a 3×3 grid on paper: main diagonal is [i][i], anti-diagonal is [i][n-1-i]; then wrap in abs().'
};
const TIERS = {
  1: { name: 'Tier 1 · Foundations', range: 'Below 50%', tagline: 'Needs support with the basics',
       badge: 'bg-rose-500/15 text-rose-300 border-rose-500/40', ring: '#f43f5e', bar: 'bg-rose-500', glow: 'from-rose-500/20',
       focus: 'Targeted remediation on syntax and loop mechanics',
       recs: ['Re-trace variable assignment, operators and precedence by hand — 15–20 short drills a day for two weeks.',
              'Loop mechanics clinic: write trace tables (i, total, output) for for/while loops, then practise break and continue.',
              'Re-do FizzBuzz daily from a blank file until the syntax in your language is automatic.',
              'Join a small-group instructor clinic and pair with a Tier 3 peer; re-assess in two weeks.'] },
  2: { name: 'Tier 2 · Competent', range: '50% – 85%', tagline: 'Functional logic, ready to level up',
       badge: 'bg-sky-500/15 text-sky-300 border-sky-500/40', ring: '#38bdf8', bar: 'bg-sky-500', glow: 'from-sky-500/20',
       focus: 'Standard track coding katas',
       recs: ['Follow the standard kata track: two katas a day on functions, array filtering/mapping and nested loops.',
              'Practise 2D traversal on paper first — rows, columns, then both diagonals — then in code.',
              'Write your own edge-case tests (empty input, single element, negatives, zero) for every function.',
              'Target your weakest sections below; aim for 85%+ in every section to graduate to Tier 3.'] },
  3: { name: 'Tier 3 · Advanced', range: 'Above 85%', tagline: 'Strong across logic and matrices',
       badge: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40', ring: '#10b981', bar: 'bg-emerald-500', glow: 'from-emerald-500/20',
       focus: 'Accelerated project-based work and peer mentorship',
       recs: ['Start an accelerated mini-project (grade book, text adventure or matrix-utility library) using functions, arrays and tests.',
              'Mentor two Tier 1 peers during clinic hours — teaching is the fastest way to deepen mastery.',
              'Stretch goals: Big-O analysis, recursion, and re-implementing your solutions in a second language.',
              'Practise Git workflow and code review on every project.'] }
};

/* =========================================================
   QUIZ — 12 question TEMPLATES. Every student gets their own variant:
   numbers, names and option order are generated from a per-student seed,
   difficulty stays equal, and the answer key is computed for that variant.
   ========================================================= */
let QUESTIONS = [];   // the current student's generated questions (stored in S.questions)

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeRng(seed) {
  const f = mulberry32(seed >>> 0);
  return {
    f,
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: arr => arr[Math.floor(f() * arr.length)],
    shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  };
}
const L3 = (java, python, javascript) => ({ java, python, javascript });
const J2D = m => '{' + m.map(r => '{' + r.join(', ') + '}').join(', ') + '}';
const L2D = m => '[' + m.map(r => '[' + r.join(', ') + ']').join(', ') + ']';
function buildMC(rng, correct, cands, numeric) {
  const c = String(correct), seen = new Set([c]), ds = [];
  rng.shuffle(cands.map(String)).forEach(x => { if (!seen.has(x) && ds.length < 3) { seen.add(x); ds.push(x); } });
  let k = 1;
  while (ds.length < 3) { const v = String(Number(c) + (rng.f() < .5 ? -1 : 1) * (k++)); if (!seen.has(v)) { seen.add(v); ds.push(v); } }
  const opts = numeric ? [c, ...ds].sort((a, b) => Number(a) - Number(b)) : rng.shuffle([c, ...ds]);
  return { options: opts, answer: opts.indexOf(c) };
}
const rndMatrix = (rng, r, c, lo, hi, distinct) => {
  const used = new Set(), m = [];
  for (let i = 0; i < r; i++) { const row = []; for (let j = 0; j < c; j++) { let v; do { v = rng.int(lo, hi); } while (distinct && used.has(v)); used.add(v); row.push(v); } m.push(row); }
  return m;
};

const TEMPLATES = [
 // 1 — assignment copies a value
 rng => {
   const [x, y] = rng.pick([['a','b'],['x','y'],['p','q'],['m','n']]), a = rng.int(3, 9), k = rng.int(2, 6);
   const mc = buildMC(rng, a, [a + k, k, a * k, 2 * a + k, a - 1], true);
   return { section: 'Variables & Operators', type: 'mc', text: 'What is printed?',
     code: L3(`int ${x} = ${a};\nint ${y} = ${x};\n${x} = ${x} + ${k};\nSystem.out.println(${y});`, `${x} = ${a}\n${y} = ${x}\n${x} = ${x} + ${k}\nprint(${y})`, `let ${x} = ${a};\nlet ${y} = ${x};\n${x} = ${x} + ${k};\nconsole.log(${y});`),
     ...mc, explain: `${y} copies the value of ${x} (${a}) at that moment. Changing ${x} afterwards (to ${a + k}) does not change ${y}.` };
 },
 // 2 — operator precedence (two forms)
 rng => {
   if (rng.f() < .5) {
     const t = rng.int(2, 4), m = rng.int(2, 6), s = t * m, p = rng.int(2, 9), q = rng.int(2, 6), r = rng.int(2, 6), ans = p + q * r - m;
     const mc = buildMC(rng, ans, [Math.floor(((p + q) * r - s) / t), (p + q) * r - m, p + q * r - s, p + q * r + m, p + q * r], true);
     return { section: 'Variables & Operators', type: 'mc', text: 'What value does result hold? (Remember operator precedence.)',
       code: L3(`int result = ${p} + ${q} * ${r} - ${s} / ${t};`, `result = ${p} + ${q} * ${r} - ${s} // ${t}`, `let result = ${p} + ${q} * ${r} - Math.floor(${s} / ${t});`),
       ...mc, explain: `Multiplication and division run before addition and subtraction: ${p} + ${q * r} - ${m} = ${ans}. (Going strictly left-to-right is the classic trap.)` };
   }
   let p, q, r, s, t;
   do { p = rng.int(2, 6); q = rng.int(2, 6); r = rng.int(2, 6); s = rng.int(10, 29); t = rng.int(3, 7); } while (s % t === 0);
   const ans = p * (q + r) - (s % t);
   const mc = buildMC(rng, ans, [(p * (q + r) - s) % t, p * q + r - (s % t), p * (q + r) - s, p * (q + r) + (s % t), p * q + r], true);
   const e = `int result = ${p} * (${q} + ${r}) - ${s} % ${t};`;
   return { section: 'Variables & Operators', type: 'mc', text: 'What value does result hold? (Remember operator precedence.)',
     code: L3(e, `result = ${p} * (${q} + ${r}) - ${s} % ${t}`, `let result = ${p} * (${q} + ${r}) - ${s} % ${t};`),
     ...mc, explain: `Brackets first: ${q} + ${r} = ${q + r}, so ${p} * ${q + r} = ${p * (q + r)}. Then % binds tighter than -: ${s} % ${t} = ${s % t}. Result: ${p * (q + r)} - ${s % t} = ${ans}.` };
 },
 // 3 — integer division and remainder
 rng => {
   const x = rng.int(23, 97), d = rng.int(4, 9), q = Math.floor(x / d), r = x % d, ans = q * 10 + r;
   const mc = buildMC(rng, ans, [r * 10 + q, q + r, q * 10 + r + 1, (q + 1) * 10 + r, q * d + r + q], true);
   return { section: 'Variables & Operators', type: 'mc', text: 'What is printed? (Integer division and remainder.)',
     code: L3(`int x = ${x};\nint q = x / ${d};\nint r = x % ${d};\nSystem.out.println(q * 10 + r);`, `x = ${x}\nq = x // ${d}\nr = x % ${d}\nprint(q * 10 + r)`, `let x = ${x};\nlet q = Math.floor(x / ${d});\nlet r = x % ${d};\nconsole.log(q * 10 + r);`),
     ...mc, explain: `${x} ÷ ${d} = ${q} remainder ${r}, so q = ${q} and r = ${r}. q * 10 + r = ${q * 10} + ${r} = ${ans}.` };
 },
 // 4 — compound assignment (short answer)
 rng => {
   const n0 = rng.int(5, 15), a = rng.int(3, 9), c = rng.int(2, 4); let m, t;
   do { m = rng.int(7, 20); t = rng.int(3, 6); } while (m % t === 0);
   const ans = (n0 + a) * c - (m % t);
   return { section: 'Variables & Operators', type: 'sa', text: 'What is the final value of n? (Type a number.)',
     code: L3(`int n = ${n0};\nn += ${a};\nn *= ${c};\nn -= ${m} % ${t};\nSystem.out.println(n);`, `n = ${n0}\nn += ${a}\nn *= ${c}\nn -= ${m} % ${t}\nprint(n)`, `let n = ${n0};\nn += ${a};\nn *= ${c};\nn -= ${m} % ${t};\nconsole.log(n);`),
     accept: [String(ans)], answerText: String(ans),
     explain: `n: ${n0} → ${n0 + a} → ${(n0 + a) * c}. On the last line the right side is evaluated first: ${m} % ${t} = ${m % t}, so n = ${(n0 + a) * c} - ${m % t} = ${ans}.` };
 },
 // 5 — two separate ifs (the else belongs to the second)
 rng => {
   const [d1, d2] = rng.pick([[3,5],[2,3],[2,5],[3,4],[4,5]]), x = rng.int(10, 60), A = x % d1 === 0, B = x % d2 === 0;
   const labels = ['C only', 'B only', 'A, then B (two lines)', 'A, then C (two lines)'];
   const correct = A && B ? labels[2] : A ? labels[3] : B ? labels[1] : labels[0];
   const options = rng.shuffle(labels);
   return { section: 'Control Structures', type: 'mc', text: 'Which describes the output?',
     code: L3(`int x = ${x};\nif (x % ${d1} == 0) {\n    System.out.println("A");\n}\nif (x % ${d2} == 0) {\n    System.out.println("B");\n} else {\n    System.out.println("C");\n}`,
              `x = ${x}\nif x % ${d1} == 0:\n    print("A")\nif x % ${d2} == 0:\n    print("B")\nelse:\n    print("C")`,
              `let x = ${x};\nif (x % ${d1} === 0) {\n    console.log("A");\n}\nif (x % ${d2} === 0) {\n    console.log("B");\n} else {\n    console.log("C");\n}`),
     options, answer: options.indexOf(correct),
     explain: `These are two separate if statements. ${x} ${A ? 'is' : 'is not'} divisible by ${d1} → ${A ? 'prints A' : 'prints nothing'}. The else belongs to the second if: ${x} ${B ? 'is' : 'is not'} divisible by ${d2} → ${B ? 'prints B' : 'prints C'}.` };
 },
 // 6 — loop + condition accumulate
 rng => {
   const N = rng.int(8, 15), m = rng.int(2, 4); let total = 0, all = 0, non = 0, incl = 0, cnt = 0;
   for (let i = 0; i < N; i++) { all += i; if (i % m === 0) { total += i; cnt++; } else non += i; }
   for (let i = 0; i <= N; i++) if (i % m === 0) incl += i;
   const mc = buildMC(rng, total, [all, non, incl, cnt, total + N], true);
   return { section: 'Control Structures', type: 'mc', text: 'What is printed?',
     code: L3(`int total = 0;\nfor (int i = 0; i < ${N}; i++) {\n    if (i % ${m} == 0) {\n        total += i;\n    }\n}\nSystem.out.println(total);`,
              `total = 0\nfor i in range(${N}):\n    if i % ${m} == 0:\n        total += i\nprint(total)`,
              `let total = 0;\nfor (let i = 0; i < ${N}; i++) {\n    if (i % ${m} === 0) {\n        total += i;\n    }\n}\nconsole.log(total);`),
     ...mc, explain: `i runs 0–${N - 1} and only multiples of ${m} are added: ${Array.from({ length: N }, (_, i) => i).filter(i => i % m === 0).join(' + ')} = ${total}.` };
 },
 // 7 — break / continue
 rng => {
   const M = rng.int(7, 9), s = rng.int(2, 4), b = rng.int(s + 2, M - 1);
   const seq = (to, skip) => { const o = []; for (let i = 1; i <= to; i++) if (!skip || i !== s) o.push(i); return o.join(' '); };
   const correct = seq(b - 1, true);
   const mc = buildMC(rng, correct, [seq(b, true), seq(b - 1, false), seq(M, true), seq(b - 1, true) + ' ' + b], false);
   return { section: 'Control Structures', type: 'mc', text: 'What is the output? (Numbers are separated by spaces.)',
     code: L3(`for (int i = 1; i <= ${M}; i++) {\n    if (i == ${s}) continue;\n    if (i == ${b}) break;\n    System.out.print(i + " ");\n}`,
              `for i in range(1, ${M + 1}):\n    if i == ${s}:\n        continue\n    if i == ${b}:\n        break\n    print(i, end=" ")`,
              `let out = "";\nfor (let i = 1; i <= ${M}; i++) {\n    if (i === ${s}) continue;\n    if (i === ${b}) break;\n    out += i + " ";\n}\nconsole.log(out);`),
     ...mc, explain: `continue skips just i = ${s}. break stops the whole loop when i reaches ${b} (before printing it). Printed: ${correct}.` };
 },
 // 8 — parameters are copies; return value
 rng => {
   const fn = rng.pick(['f', 'g', 'h']), p = rng.int(1, 5), q = rng.int(2, 4), y = rng.int(2, 9), z = (y + p) * q;
   const correct = `${y} ${z}`;
   const mc = buildMC(rng, correct, [`${y + p} ${z}`, `${y} ${y * q + p}`, `${y + p} ${y + p}`, `${y} ${y * q}`, `${y + p} ${y * q}`], false);
   return { section: 'Functions & Scope', type: 'mc', text: 'What is printed?',
     code: L3(`static int ${fn}(int x) {\n    x = x + ${p};\n    return x * ${q};\n}\n\nint y = ${y};\nint z = ${fn}(y);\nSystem.out.println(y + " " + z);`,
              `def ${fn}(x):\n    x = x + ${p}\n    return x * ${q}\n\ny = ${y}\nz = ${fn}(y)\nprint(y, z)`,
              `function ${fn}(x) {\n    x = x + ${p};\n    return x * ${q};\n}\n\nlet y = ${y};\nlet z = ${fn}(y);\nconsole.log(y, z);`),
     ...mc, explain: `The parameter x is a copy of y, so y stays ${y}. Inside ${fn}: x becomes ${y + p}, and the function returns ${y + p} * ${q} = ${z}.` };
 },
 // 9 — scope: shadowing OR modifying a global
 rng => {
   const c0 = rng.int(0, 9);
   if (rng.f() < .5) {
     const v = rng.int(2, 9), mc = buildMC(rng, c0, [v + 1, v, c0 + 1, 'Error'], false);
     return { section: 'Functions & Scope', type: 'mc', text: 'What is printed after add() runs?',

/* ---------- JavaScript test-suite (runs the student's real code) ----------
   NOTE: must stay fully self-contained — it is serialised into a Web Worker. */
function runJsTests(task, code, P) {
  const logs = [];
  const fakeConsole = { log: (...a) => logs.push(a.join(' ')), error(){}, warn(){}, info(){} };
  const names = { A: 'fizzBuzz', B: 'filterAndDouble', C: 'diagonalDifference' };
  let fn;
  try {
    fn = new Function('console', code + '\n;return (typeof ' + names[task] + ' === "function") ? ' + names[task] + ' : undefined;')(fakeConsole);
  } catch (e) { return { error: 'Error in your code: ' + e.message, tests: [] }; }
  if (!fn) return { error: 'Function ' + names[task] + '() was not found. Keep the function name from the starter code.', tests: [] };
  const T = [];
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const add = (name, f) => {
    try { const r = f(); T.push({ label: name, pass: !!r.pass, detail: r.detail || '' }); }
    catch (e) { T.push({ label: name, pass: false, detail: 'Threw: ' + e.message }); }
  };
  if (task === 'A') {
    const d1 = P.d1, d2 = P.d2, n = P.n;
    let lines;
    try {
      const ret = fn();
      if (Array.isArray(ret)) lines = ret.map(String);
      else { lines = logs.slice(); if (lines.length === 1 && lines[0].indexOf('\n') > -1) lines = lines[0].split('\n'); }
    } catch (e) { return { error: 'Your function threw: ' + e.message, tests: [] }; }
    const expectAt = (pred, want) => {
      const bad = [];
      for (let i = 1; i <= n; i++) if (pred(i) && lines[i - 1] !== want(i)) bad.push('#' + i + ' → ' + JSON.stringify(lines[i - 1]));
      return { pass: lines.length === n && bad.length === 0, detail: bad.length ? 'Wrong at ' + bad.slice(0, 3).join(', ') : '' };
    };
    add('Returns exactly ' + n + ' items', () => ({ pass: lines.length === n, detail: 'Got ' + lines.length + ' items' }));
    add('Plain numbers (neither ' + d1 + ' nor ' + d2 + ')', () => expectAt(i => i % d1 && i % d2, i => String(i)));
    add('Multiples of ' + d1 + ' only → "Fizz"', () => expectAt(i => i % d1 === 0 && i % d2 !== 0, () => 'Fizz'));
    add('Multiples of ' + d2 + ' only → "Buzz"', () => expectAt(i => i % d2 === 0 && i % d1 !== 0, () => 'Buzz'));
    add('Multiples of both ' + d1 + ' and ' + d2 + ' → "FizzBuzz"', () => expectAt(i => i % d1 === 0 && i % d2 === 0, () => 'FizzBuzz'));
  }
  if (task === 'B') {
    const k = P.k;
    const eq = (label, input, want) => add(label, () => { const got = fn(input.slice()); return { pass: Array.isArray(got) && same(got, want), detail: 'Got ' + JSON.stringify(got) + ', expected ' + JSON.stringify(want) }; });
    eq('Example [1..6] → ' + JSON.stringify([2 * k, 4 * k, 6 * k]), [1,2,3,4,5,6], [2 * k, 4 * k, 6 * k]);
    eq('Empty list → []', [], []);
    eq('No evens [7, 9, 11] → []', [7,9,11], []);
    eq('Zero and negatives [0, -2, -3, 5] → ' + JSON.stringify([0, -2 * k]), [0,-2,-3,5], [0, -2 * k]);
    eq('Mixed [10, 15, 20, 25, 30] → ' + JSON.stringify([10 * k, 20 * k, 30 * k]), [10,15,20,25,30], [10 * k, 20 * k, 30 * k]);
    P.rand.forEach((r, i) => eq('Random list #' + (i + 1) + ' ' + JSON.stringify(r[0]), r[0], r[1]));
    add('Does not modify the input list', () => { const a = [1,2,3,4]; const got = fn(a); return { pass: same(a, [1,2,3,4]) && Array.isArray(got) && got !== a, detail: 'Input afterwards: ' + JSON.stringify(a) }; });
  }
  if (task === 'C') {
    const eq = (label, m, want) => add(label, () => { const got = fn(JSON.parse(JSON.stringify(m))); return { pass: got === want, detail: 'Got ' + JSON.stringify(got) + ', expected ' + want }; });
    eq('Worked example (3×3) → ' + P.demoWant, P.demo, P.demoWant);
    eq('2×2 with equal diagonals → 0', [[1,2],[3,4]], 0);
    eq('1×1 matrix → 0', [[1]], 0);
    eq('Anti-diagonal larger (needs abs) → 15', [[1,9],[8,1]], 15);
    P.rand.forEach((r, i) => eq('Random ' + r[0].length + '×' + r[0].length + ' matrix → ' + r[1], r[0], r[1]));
  }
  return { error: null, tests: T };
}

function runInWorker(task, code, P) {
  return new Promise(resolve => {
    try {
      const src = '(' + runJsTests.toString() + ')';
      const blob = new Blob(['self.onmessage=function(e){var f=' + src + ';var r;try{r=f(e.data.task,e.data.code,e.data.P);}catch(err){r={error:String(err),tests:[]};}self.postMessage(r);};'], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      const worker = new Worker(url);
      const timer = setTimeout(() => { worker.terminate(); URL.revokeObjectURL(url); resolve({ error: 'Timed out after 4 seconds — check for an infinite loop.', tests: [] }); }, 4000);
      worker.onmessage = e => { clearTimeout(timer); worker.terminate(); URL.revokeObjectURL(url); resolve(e.data); };
      worker.onerror = () => { clearTimeout(timer); worker.terminate(); URL.revokeObjectURL(url); resolve(runJsTests(task, code, P)); };
      worker.postMessage({ task, code, P });
    } catch (err) { resolve(runJsTests(task, code, P)); }
  });
}

  python:'def|return|if|elif|else|for|while|break|continue|in|range|and|or|not|True|False|None|print|len|import|from|pass|lambda|abs',
  javascript:'let|const|var|function|return|if|else|for|while|break|continue|new|true|false|null|undefined|of|in|console|Math'
};
function highlight(code, lang) {
  const cm = lang === 'python' ? '#.*' : '\\/\\/.*';
  const re = new RegExp('(' + cm + ')|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Za-z_]\\w*)\\b', 'g');
  const kw = new Set(KW[lang].split('|'));
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="tk-c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tk-s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-n">${esc(m[3])}</span>`;
    else if (kw.has(m[4])) out += `<span class="tk-k">${esc(m[4])}</span>`;
    else out += esc(m[4]);
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* ---------- integrity guard: no copy / cut / paste / drop / right-click during the test ---------- */
const inField = t => { const el = t && (t.nodeType === 1 ? t : t.parentElement); return !!(el && el.closest && el.closest('input,textarea')); };
['copy', 'cut', 'paste', 'contextmenu', 'dragstart', 'drop', 'selectstart'].forEach(ev => document.addEventListener(ev, e => {
  if (!guardOn() || window.__allowCopy) return;
  if (ev === 'selectstart' && inField(e.target)) return;
  e.preventDefault();
  if (ev === 'copy' || ev === 'cut' || ev === 'paste') toast('Copy & paste are disabled during the assessment');
}, true));
document.addEventListener('beforeinput', e => { if (guardOn() && /FromPaste|FromDrop|FromYank/.test(e.inputType || '')) { e.preventDefault(); toast('Pasting is disabled during the assessment'); } }, true);

/* ---------- persistence: survive refresh / accidental close (localStorage) ---------- */
const SAVE_KEY = 'cc_session_v1';
const PERSIST = ['phase','name','lang','qi','answers','code','task','runs','startedAt','result','stageRes','blurs','cur','deadline','timerStage','seed','questions','params'];
function saveState() {
  if (S.phase === 'instructor') return;
  try { const o = {}; PERSIST.forEach(k => o[k] = S[k]); localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch (e) {}
}
let _saveT = null;
function saveSoon() { clearTimeout(_saveT); _saveT = setTimeout(saveState, 400); }
function clearState() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function restoreState() {
  let o = null; try { o = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
  if (!o || !['quiz','coding','stageResult','results'].includes(o.phase) || !o.questions || !o.questions.length || !o.params) return false;
  PERSIST.forEach(k => { if (o[k] !== undefined && o[k] !== null) S[k] = o[k]; });

}

  finishTask(S.task, false);

  $('#overlay').classList.remove('hidden'); $('#overlay').classList.add('grid');

  g.forced = forced; S.stageRes[t] = g;

function computeResult(coding) {

  const secs = SECTIONS.map(name => {

    const ok = qs.filter(x => x.a && x.a.ok).length;
    return { name, got: ok, total: qs.length, pct: Math.round(ok / qs.length * 100), detail: ok + ' / ' + qs.length + ' correct' };
  });
  ['A','B','C'].forEach(k => secs.push({ name: 'Task ' + k, got: coding[k].score, total: TASKS[k].max, pct: Math.round(coding[k].score / TASKS[k].max * 100), detail: r1(coding[k].score) + ' / ' + TASKS[k].max + ' pts' }));

    const T = TASKS[k], c = R._coding[k], f = T.fn[R.lang];
    add(T.title + '   [' + T.level + ', ' + T.max + ' points, ' + (LIMITS[k] / 60) + ' min limit]');
    add('Variant parameters: ' + (k === 'A' ? 'range 1–' + P.A.n + ', Fizz = multiples of ' + P.A.d1 + ', Buzz = multiples of ' + P.A.d2 : k === 'B' ? 'keep even numbers, multiply by ' + P.B.k : 'worked example matrix ' + JSON.stringify(P.C.demo) + ' → ' + P.C.demoWant));
    add('Task statement (' + lang + ', function ' + f + '):'); add(indent(plain(T.desc(f, P[k])), 4));
    add(); add('Student submission' + (c.forced ? ' (AUTO-SUBMITTED when the timer ended)' : '') + ':');
    add(indent(S.code[k], 4));
    add(); add('Grading method: ' + (c.kind === 'tests' ? 'automated tests — the code was actually executed' : 'pattern/structure checks only — the code was NOT executed, so review it manually'));
    if (c.note) add('Note: ' + c.note);
    if (c.error) add('Error: ' + c.error);
    c.items.forEach(i => add('  [' + (i.pass ? 'PASS' : 'FAIL') + '] ' + i.label + (i.pts ? ' (' + i.pts + ' pts)' : '') + (!i.pass && i.detail ? '\n         ' + i.detail : '')));
    add('SCORE: ' + r1(c.score) + ' / ' + T.max);
    add(TH);
  });
  head('5. NOTES FOR THE REVIEWER');
  add('* Quiz marking is exact (answer key generated for this student\'s variant).');
  add('* JavaScript solutions are executed against test cases. Java and Python solutions are checked by pattern only; a correct but unusual solution may lose points, and an incorrect one that contains the right keywords may gain some. Please read the submissions above before finalising marks.');
  add('* Different students receive different numbers/values for the same question type, so compare students by question TEMPLATE number and section, not by raw answers.');
  add(); add('End of record for ' + R.name + '.');
  return L.join('\n') + '\n';
}
function downloadTxt() {
  const name = (S.result.name || 'student').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, ' ').trim() || 'student';
  download(name + '.txt', buildReport(), 'text/plain;charset=utf-8');
  toast('Saved as ' + name + '.txt');
}

function restart() { if (confirm('Start a new assessment for another student?')) { clearState(); S.name = ''; S.lang = ''; S.result = null; S.stageRes = {}; S.answers = []; go('register'); } }

/* =========================================================
   INSTRUCTOR VIEW
   ========================================================= */
function showInstructor() { if (S.phase !== 'instructor') S.prevPhase = S.phase; if (S.prevPhase === 'quiz' || S.prevPhase === 'coding') { const ed = $('#editor'); if (ed) S.code[S.task] = ed.value; } S.phase = 'instructor'; renderStepper(); render(); window.scrollTo(0, 0); }
function cohortRows() {
  let local = []; try { local = JSON.parse(localStorage.getItem('cc_results') || '[]'); } catch (e) {}
  const seen = new Set(), rows = [];
  [...local, ...S.pasted].forEach(r => { const k = r.name + '|' + r.date; if (!seen.has(k)) { seen.add(k); rows.push(r); } });
  return rows.sort((a, b) => b.total - a.total);
}
function renderInstructor() {
  const rows = cohortRows(), cnt = { 1: 0, 2: 0, 3: 0 }; rows.forEach(r => cnt[r.tier]++);
  const avg = rows.length ? r1(rows.reduce((s, r) => s + r.total, 0) / rows.length) : 0;
  $('#screen').innerHTML = `
  <section class="fade-in space-y-5">
    <div class="flex items-center justify-between flex-wrap gap-3"><div><h2 class="text-2xl font-bold text-white">Instructor view</h2><p class="text-sm text-slate-400">Cohort results from this device plus any result codes you paste below.</p></div>
      <button class="btn btn-ghost" onclick="go(S.prevPhase)">← Back</button></div>
    <div class="grid sm:grid-cols-4 gap-3">
      <div class="card p-4"><div class="text-3xl font-extrabold text-white">${rows.length}</div><div class="text-xs text-slate-400">students</div></div>
      ${[1,2,3].map(t => `<div class="card p-4"><div class="text-3xl font-extrabold ${t === 1 ? 'text-rose-300' : t === 2 ? 'text-sky-300' : 'text-emerald-300'}">${cnt[t]}</div><div class="text-xs text-slate-400">${TIERS[t].name}</div></div>`).join('')}
    </div>
    <div class="card p-5"><h3 class="font-bold text-white">Paste result codes</h3>
      <textarea id="pasteBox" rows="3" placeholder="One result code per line" class="mt-2 w-full rounded-lg bg-slate-900/80 border border-white/15 px-3 py-2 font-mono text-xs outline-none focus:border-indigo-400"></textarea>
      <div class="mt-2 flex flex-wrap gap-2"><button class="btn btn-primary" onclick="importCodes()">Add to table</button>
        <button class="btn btn-ghost" onclick="exportCSV()" ${rows.length ? '' : 'disabled'}>Export CSV</button>
        <button class="btn btn-ghost" onclick="clearLocal()">Clear this device's results</button></div></div>
    <div class="card p-0 overflow-x-auto"><table class="w-full text-sm">
      <thead class="text-xs uppercase text-slate-400 border-b border-white/10"><tr><th class="text-left p-3">Student</th><th class="p-3">Lang</th><th class="p-3">Total</th><th class="p-3">Tier</th><th class="p-3">Quiz /40</th><th class="p-3">A /15</th><th class="p-3">B /20</th><th class="p-3">C /25</th><th class="p-3">Weakest section</th><th class="p-3">Tab switches</th></tr></thead>
      <tbody>${rows.length ? rows.map(r => { const weak = [...r.secs].sort((a, b) => a.pct - b.pct)[0]; return `<tr class="border-b border-white/5 text-center">
        <td class="p-3 text-left text-white font-medium">${esc(r.name)}</td><td class="p-3">${LANGS[r.lang] ? LANGS[r.lang].label : esc(r.lang)}</td><td class="p-3 font-bold text-white">${r.total}</td>
        <td class="p-3"><span class="px-2 py-0.5 rounded-full border text-xs ${TIERS[r.tier].badge}">T${r.tier}</span></td><td class="p-3">${r.quiz}</td><td class="p-3">${r.A}</td><td class="p-3">${r.B}</td><td class="p-3">${r.C}</td>
        <td class="p-3 text-xs text-slate-400">${esc(weak.name)} (${weak.pct}%)</td><td class="p-3 text-xs ${r.blurs > 2 ? 'text-rose-300' : 'text-slate-400'}">${r.blurs ?? '–'}</td></tr>`; }).join('') : `<tr><td colspan="10" class="p-6 text-center text-slate-500">No results yet.</td></tr>`}</tbody></table></div>
  </section>`;
}
function importCodes() {
  const lines = $('#pasteBox').value.split(/\s+/).filter(Boolean); let ok = 0;
  lines.forEach(l => { try { const r = decodeResult(l); if (r && r.name && typeof r.total === 'number') { S.pasted.push(r); ok++; } } catch (e) {} });
  toast(ok + ' of ' + lines.length + ' codes added'); renderInstructor();
}
function exportCSV() {
  const rows = cohortRows(), head = ['Name','Language','Total','Tier','Quiz','TaskA','TaskB','TaskC','Minutes','TabSwitches','Date'];
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  download('cohort-results.csv', [head.join(','), ...rows.map(r => [r.name, r.lang, r.total, r.tier, r.quiz, r.A, r.B, r.C, r.minutes, r.blurs ?? '', r.date].map(q).join(','))].join('\n'), 'text/csv');
}
function clearLocal() { if (confirm("Delete all results stored on this device?")) { try { localStorage.removeItem('cc_results'); } catch (e) {} renderInstructor(); } }

/* ---------- boot ---------- */
if (restoreState()) {
  document.body.classList.toggle('guard', guardOn()); renderStepper(); render();
  if (S.phase === 'quiz' || S.phase === 'coding') {
    if (S.deadline - Date.now() <= 0) onTimeUp();
    else { TIMER = setInterval(tick, 250); toast('Welcome back — your progress and timer were restored'); }
  }
} else { renderStepper(); render(); }
</script>
</body>
</html>
